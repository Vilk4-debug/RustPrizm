name: Build

on:
  workflow_call:
    inputs:
      build_type:
        description: 'Build Type'
        default: 'Debug'
        type: string
      version:
        description: Version identifier
        type: string
        required: false
      devel:
        description: 'Development mode (disables update checker)'
        type: string
        required: false
        default: 'true'
    secrets:
      SPARKLE_ED25519_KEY:
        required: false


jobs:
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      build_type: ${{ inputs.build_type || 'Release' }}
      version: ${{ inputs.version }}
      devel: ${{ inputs.devel }}

